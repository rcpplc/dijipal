<!DOCTYPE html>
<html>
<head>
    <title>Simple Image Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .upload-area { border: 2px dashed #ccc; padding: 20px; margin: 20px 0; }
        .images { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .image-item { border: 1px solid #ccc; padding: 10px; }
        .image-item img { width: 100%; height: 200px; object-fit: cover; }
        .loading { color: blue; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Simple Image Upload Test</h1>
    
    <div class="upload-area">
        <input type="file" id="fileInput" multiple accept="image/*">
        <button onclick="uploadFiles()">Upload</button>
    </div>
    
    <div id="status"></div>
    
    <div id="images" class="images"></div>
    
    <script>
        let uploadedImages = [];
        
        async function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const files = fileInput.files;
            
            if (files.length === 0) {
                alert('Please select files');
                return;
            }
            
            status.innerHTML = '<div class="loading">Uploading...</div>';
            
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    uploadedImages = [...uploadedImages, ...result.images];
                    displayImages();
                    status.innerHTML = `<div style="color: green;">Uploaded ${result.images.length} images!</div>`;
                    fileInput.value = '';
                } else {
                    status.innerHTML = '<div class="error">Upload failed</div>';
                }
                
            } catch (error) {
                status.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        function displayImages() {
            const container = document.getElementById('images');
            container.innerHTML = '';
            
            uploadedImages.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'image-item';
                div.innerHTML = `
                    <img src="${img.url}" alt="${img.name}">
                    <div><strong>${img.name}</strong></div>
                    <div>Size: ${Math.round(img.size / 1024)}KB</div>
                    <button onclick="removeImage(${index})">Remove</button>
                `;
                container.appendChild(div);
            });
        }
        
        function removeImage(index) {
            uploadedImages.splice(index, 1);
            displayImages();
        }
    </script>
</body>
</html>
